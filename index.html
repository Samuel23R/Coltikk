
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coltikk</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">Coltikk</div>
    <nav class="nav">
      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="#producto">Producto</a></li>
        <li><a href="#comprar">Carrito</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="producto" class="product-section">
      <div class="content">
        <h1>AirPods 2da Generación</h1>
        <img src="assets/images/airpods.jpg" alt="AirPods" />
        <p class="price">$100.000 COP</p>
        <button onclick="addToCart()">Agregar al carrito</button>
      </div>
    </section>
    <section id="comprar" class="cart-section">
      <h2>Tu Carrito</h2>
      <div id="cart"></div>
      <button onclick="confirmOrder()">Confirmar pedido por WhatsApp</button>
    </section>
    <section id="contacto" class="contact-section">
      <h2>Métodos de Pago</h2>
      <p>Nequi / Daviplata: <strong>3195546863</strong></p>
    </section>
  </main>
  <footer>
    <p>© 2025 Coltikk - Todos los derechos reservados</p>
  </footer>
  <script src="assets/js/script.js"></script>
</body>
</html>
