
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coltikk | AirPods 2Gen</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <style>
    :root {
      --gold: #d4af37;
      --black: #111;
      --white: #fff;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--white);
      color: var(--black);
    }
    header {
      background: var(--black);
      color: var(--white);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header .logo img {
      height: 50px;
    }
    header nav {
      display: none;
      flex-direction: column;
      gap: 1rem;
      background: var(--black);
      position: absolute;
      top: 60px;
      right: 20px;
      padding: 1rem;
      border: 1px solid var(--gold);
    }
    header nav a {
      color: var(--white);
      text-decoration: none;
    }
    .menu-toggle {
      font-size: 2rem;
      cursor: pointer;
    }
    .hero {
      background: url('https://i.imgur.com/Y5y9FXT.jpg') center/cover no-repeat;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      border-radius: 8px;
    }
    .productos {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }
    .producto {
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      background: var(--white);
    }
    .producto:hover {
      transform: scale(1.05);
    }
    .producto img {
      width: 100%;
    }
    .producto .info {
      padding: 1rem;
    }
    .producto .info h3 {
      margin: 0.5rem 0;
    }
    .producto .info p {
      color: #555;
    }
    .producto .info input {
      width: 50px;
      margin-right: 0.5rem;
    }
    .producto .info button {
      background: var(--gold);
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .producto .info button:hover {
      background: #c79b2e;
    }
    footer {
      background: var(--black);
      color: var(--white);
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
    #whatsapp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      padding: 1rem;
      border-radius: 50%;
      font-size: 1.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://i.imgur.com/YourLogoImage.png" alt="Coltikk Logo">
    </div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <nav id="menu">
      <a href="#productos">Productos</a>
      <a href="#carrito">Carrito</a>
      <a href="#nosotros">Sobre Nosotros</a>
    </nav>
  </header>

  <section class="hero animate_animated animate_fadeIn">
    <h1>AirPods 2Gen - Calidad y Estilo</h1>
  </section>

  <section id="productos" class="productos">
    <div class="producto animate_animated animate_zoomIn">
      <img src="https://i.imgur.com/YourProductImage.png" alt="AirPods 2Gen">
      <div class="info">
        <h3>AirPods 2da Generación</h3>
        <p>Precio: <strong>99.999 COP</strong></p>
        <label>Cantidad: <input type="number" min="1" value="1" id="cantidad"></label>
        <button onclick="agregarAlCarrito()">Agregar al carrito</button>
      </div>
    </div>
  </section>

  <section id="nosotros" style="padding: 2rem; text-align:center">
    <h2>Sobre Coltikk</h2>
    <p>Tu tienda confiable de tecnología. Compra fácil, paga por Nequi o Daviplata al <strong>3195546863</strong>.</p>
  </section>

  <footer>
    <p>&copy; 2025 Coltikk. Todos los derechos reservados.</p>
  </footer>

  <a id="whatsapp-btn" href="https://wa.me/573195546863?text=Hola,%20quiero%20comprar%20unos%20AirPods%202Gen." target="_blank">WhatsApp</a>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }
    function agregarAlCarrito() {
      const cantidad = document.getElementById('cantidad').value;
      const mensaje = Hola, quiero comprar ${cantidad} AirPods 2Gen.;
      window.open(https://wa.me/573195546863?text=${encodeURIComponent(mensaje)}, '_blank');
    }
  </script>
</body>
</html>
